<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>耳語 MIMI — 日文即時口譯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b2a;        /* 深夜海 */
  --ink2:#152638;
  --glass:#5fd3c4;      /* 琉球玻璃青 */
  --glass-dim:#3a8a80;
  --sand:#f2ede3;       /* 沙灘白 */
  --sand-dim:#9aa7b4;
  --warn:#f0b45f;
  --err:#e8756a;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--sand);
  font-family:'Noto Sans TC',sans-serif;
  display:flex;flex-direction:column;
  height:100dvh;
  overflow:hidden;
}
.jp{font-family:'Noto Sans JP',sans-serif}

/* ── 頂欄 ── */
header{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  border-bottom:1px solid rgba(95,211,196,.15);
  flex-shrink:0;
}
header h1{
  font-family:'Zen Maru Gothic',sans-serif;
  font-size:1.05rem;font-weight:700;letter-spacing:.12em;
  color:var(--glass);
}
header .sub{font-size:.7rem;color:var(--sand-dim);letter-spacing:.05em}
header .spacer{flex:1}
.iconbtn{
  background:none;border:1px solid rgba(242,237,227,.2);color:var(--sand-dim);
  border-radius:10px;padding:6px 10px;font-size:.75rem;cursor:pointer;
  font-family:inherit;
}
.iconbtn:active{background:rgba(242,237,227,.08)}

/* ── 對話流 ── */
#stream{
  flex:1;overflow-y:auto;
  padding:16px 18px 8px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--sand-dim);text-align:center;padding:0 32px;
}
.empty .big{font-size:2.6rem}
.empty p{font-size:.85rem;line-height:1.7}

.seg{
  margin-bottom:18px;
  animation:rise .3s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg .src{
  font-size:.88rem;color:var(--sand-dim);line-height:1.6;
  padding-left:12px;border-left:2px solid var(--glass-dim);
}
.seg .dst{
  margin-top:6px;
  font-size:1.35rem;font-weight:500;line-height:1.55;
  color:var(--sand);
  padding-left:12px;border-left:2px solid var(--glass);
}
.seg .dst.pending{color:var(--sand-dim);font-size:1rem}
.seg .dst.error{color:var(--err);font-size:.9rem}
.seg time{
  display:block;font-size:.62rem;color:rgba(154,167,180,.55);
  margin-bottom:4px;letter-spacing:.08em;
}

/* ── 即時聽寫列 ── */
#interim{
  flex-shrink:0;
  min-height:0;
  padding:0 18px;
  overflow:hidden;
  transition:all .25s ease;
}
#interim.on{
  padding:10px 18px;
  border-top:1px dashed rgba(95,211,196,.25);
}
#interim .txt{
  font-size:1rem;color:var(--glass);line-height:1.5;
  opacity:.85;
}

/* ── 控制區 ── */
footer{
  flex-shrink:0;
  padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
  border-top:1px solid rgba(95,211,196,.15);
  background:var(--ink2);
  display:flex;align-items:center;gap:14px;
}
#status{
  flex:1;font-size:.75rem;color:var(--sand-dim);line-height:1.5;
}
#status.listening{color:var(--glass)}
#status.error{color:var(--err)}

#micbtn{
  width:76px;height:76px;border-radius:50%;
  border:none;cursor:pointer;flex-shrink:0;
  background:var(--glass);color:var(--ink);
  font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:.9rem;
  letter-spacing:.1em;
  box-shadow:0 0 0 0 rgba(95,211,196,.5);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#micbtn.rec{
  background:var(--err);color:#fff;
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(232,117,106,.45)}
  70%{box-shadow:0 0 0 22px rgba(232,117,106,0)}
  100%{box-shadow:0 0 0 0 rgba(232,117,106,0)}
}

/* ── 設定面板 ── */
#panel{
  position:fixed;inset:0;background:rgba(13,27,42,.92);
  display:none;align-items:center;justify-content:center;
  padding:24px;z-index:50;backdrop-filter:blur(6px);
}
#panel.open{display:flex}
#panel .card{
  background:var(--ink2);border:1px solid rgba(95,211,196,.25);
  border-radius:var(--radius);padding:22px;width:100%;max-width:420px;
}
#panel h2{font-family:'Zen Maru Gothic',sans-serif;color:var(--glass);font-size:1rem;margin-bottom:14px;letter-spacing:.08em}
#panel label{font-size:.78rem;color:var(--sand-dim);display:block;margin:12px 0 6px}
#panel input,#panel select{
  width:100%;background:var(--ink);border:1px solid rgba(242,237,227,.2);
  color:var(--sand);border-radius:10px;padding:10px 12px;font-size:.9rem;
  font-family:inherit;
}
#panel .hint{font-size:.7rem;color:var(--sand-dim);line-height:1.6;margin-top:10px}
#panel .row{display:flex;gap:10px;margin-top:18px}
#panel .row button{
  flex:1;padding:11px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:.85rem;font-weight:500;
}
#panel .save{background:var(--glass);color:var(--ink)}
#panel .close{background:none;border:1px solid rgba(242,237,227,.25);color:var(--sand)}
</style>
</head>
<body>

<header>
  <h1>耳語 MIMI</h1>
  <span class="sub">日本語 → 繁中 即時口譯</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="clearbtn">清空</button>
  <button class="iconbtn" id="setbtn">設定</button>
</header>

<div id="stream">
  <div class="empty" id="empty">
    <div class="big">👂</div>
    <p>按下「開始聆聽」,對著手機說日文<br>或讓對方靠近說話,<br>中文翻譯會即時出現在這裡。</p>
    <p style="font-size:.72rem;opacity:.7">建議使用 Chrome(Android)或 Safari(iPhone)<br>需要麥克風權限與網路連線</p>
  </div>
</div>

<div id="interim"><div class="txt jp" id="interimtxt"></div></div>

<footer>
  <div id="status">待機中</div>
  <button id="micbtn">開始<br>聆聽</button>
</footer>

<div id="panel">
  <div class="card">
    <h2>設定</h2>
    <label>翻譯引擎</label>
    <select id="engine">
      <option value="anthropic">Claude(Artifact 預覽內免金鑰)</option>
      <option value="gemini">Gemini(自行部署時使用)</option>
    </select>
    <label>Gemini API Key(選用,只存在此裝置 localStorage)</label>
    <input type="password" id="gkey" placeholder="AIza...">
    <p class="hint">在 Claude 對話中預覽本 Artifact 時,選 Claude 引擎即可直接使用。若你要部署到 GitHub Pages / Vercel 自用,請改選 Gemini 並填入你自己的 API Key。</p>
    <div class="row">
      <button class="close" id="panelclose">關閉</button>
      <button class="save" id="panelsave">儲存</button>
    </div>
  </div>
</div>

<script>
/* ───────── 狀態 ───────── */
const $ = id => document.getElementById(id);
const stream=$('stream'), interimBox=$('interim'), interimTxt=$('interimtxt');
const micbtn=$('micbtn'), statusEl=$('status'), emptyEl=$('empty');

let listening=false, rec=null, restartTimer=null;
let cfg = JSON.parse(localStorage.getItem('mimi_cfg')||'{"engine":"anthropic","gkey":""}');
let recentContext = []; // 最近幾句,給翻譯當上下文

/* ───────── 語音辨識 ───────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function buildRec(){
  const r = new SR();
  r.lang='ja-JP';
  r.continuous=true;
  r.interimResults=true;
  r.maxAlternatives=1;

  r.onresult = e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      const t=res[0].transcript.trim();
      if(!t) continue;
      if(res.isFinal){ addSegment(t); }
      else interim+=t;
    }
    setInterim(interim);
  };

  r.onerror = e=>{
    if(e.error==='no-speech') return;             // 常見,忽略
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      setStatus('麥克風權限被拒絕,請到瀏覽器設定開啟','error');
      stopListening();
      return;
    }
    setStatus('辨識錯誤:'+e.error,'error');
  };

  r.onend = ()=>{
    // 行動裝置的辨識常會自動中斷 → 持續模式下自動重啟
    if(listening){
      clearTimeout(restartTimer);
      restartTimer=setTimeout(()=>{ try{r.start();}catch(_){} },250);
    }
  };
  return r;
}

function startListening(){
  if(!SR){ setStatus('此瀏覽器不支援語音辨識,請改用 Chrome 或 Safari','error'); return; }
  rec = buildRec();
  try{ rec.start(); }catch(_){}
  listening=true;
  micbtn.classList.add('rec');
  micbtn.innerHTML='停止';
  setStatus('聆聽中… 請說日文','listening');
}
function stopListening(){
  listening=false;
  clearTimeout(restartTimer);
  if(rec){ try{rec.stop();}catch(_){} rec=null; }
  micbtn.classList.remove('rec');
  micbtn.innerHTML='開始<br>聆聽';
  setInterim('');
  if(!statusEl.classList.contains('error')) setStatus('待機中');
}
micbtn.onclick = ()=> listening ? stopListening() : startListening();

function setInterim(t){
  interimTxt.textContent=t;
  interimBox.classList.toggle('on', !!t);
}
function setStatus(t,cls){
  statusEl.textContent=t;
  statusEl.className=cls||'';
}

/* ───────── 段落與翻譯 ───────── */
let segId=0;
function addSegment(jp){
  emptyEl.style.display='none';
  const id='seg'+(++segId);
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  const div=document.createElement('div');
  div.className='seg';
  div.innerHTML=`<time>${hh}:${mm}</time>
    <div class="src jp"></div>
    <div class="dst pending" id="${id}">翻譯中…</div>`;
  div.querySelector('.src').textContent=jp;
  stream.appendChild(div);
  stream.scrollTop=stream.scrollHeight;
  translate(jp,id);
}

async function translate(jp,id){
  const ctx = recentContext.slice(-3).join('\n');
  const prompt =
`你是隨行口譯。將下面這句日文口語翻成自然的台灣繁體中文,只輸出譯文,不要任何說明或標點以外的內容。語音辨識可能有錯字,請依上下文合理修正。
${ctx?`最近的對話(僅供參考):\n${ctx}\n`:''}
要翻譯的句子:
${jp}`;

  let out='', err='';
  try{
    if(cfg.engine==='gemini' && cfg.gkey){
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cfg.gkey}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
      });
      const d=await r.json();
      out=d?.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'';
      if(!out) err=d?.error?.message||'Gemini 回應為空';
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-6',max_tokens:1000,
          messages:[{role:'user',content:prompt}]
        })
      });
      const d=await r.json();
      out=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
      if(!out) err=d?.error?.message||'翻譯回應為空(自行部署請改用 Gemini 引擎)';
    }
  }catch(e){ err=e.message; }

  const el=$(id);
  if(!el) return;
  if(out){
    el.className='dst';
    el.textContent=out;
    recentContext.push(`日:${jp} → 中:${out}`);
    if(recentContext.length>6) recentContext.shift();
  }else{
    el.className='dst error';
    el.textContent='⚠ 翻譯失敗:'+err;
  }
  stream.scrollTop=stream.scrollHeight;
}

/* ───────── 清空 / 設定 ───────── */
$('clearbtn').onclick=()=>{
  stream.querySelectorAll('.seg').forEach(n=>n.remove());
  recentContext=[]; segId=0;
  emptyEl.style.display='flex';
};
$('setbtn').onclick=()=>{
  $('engine').value=cfg.engine; $('gkey').value=cfg.gkey;
  $('panel').classList.add('open');
};
$('panelclose').onclick=()=>$('panel').classList.remove('open');
$('panelsave').onclick=()=>{
  cfg={engine:$('engine').value, gkey:$('gkey').value.trim()};
  localStorage.setItem('mimi_cfg',JSON.stringify(cfg));
  $('panel').classList.remove('open');
};
</script>
</body>
</html>
